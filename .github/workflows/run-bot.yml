name: Run NexaBot 🚀

# Manual trigger only — go to Actions tab and click "Run workflow"
on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # GitHub Actions hard limit is 6 hours per job.
    # The bot will keep running until this timeout is hit, then you
    # must manually re-run the workflow from the Actions tab. 🔁
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Inject secrets into config.py
        run: |
          sed -i 's|YOUR_BOT_TOKEN_HERE|${{ secrets.BOT_TOKEN }}|' config.py
          sed -i 's|mongodb+srv://username:password@cluster.mongodb.net/nexabot|${{ secrets.MONGO_URI }}|' config.py
          sed -i 's|OWNER_ID = 0|OWNER_ID = ${{ secrets.OWNER_ID }}|' config.py

      - name: 🤖 Start the bot
        run: python bot.py
